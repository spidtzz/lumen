# lumen — picom compositor
# lumen-settings starts picom with a generated file (~/.local/state/lumen/picom.conf)
# that includes this one and adds the window rules: no shadow or rounding for
# the bar, dimming of unfocused windows, and the accent glow on the focused
# window. Put your own global options here; don't add a `rules` list here.
backend = "glx";
vsync = true;
use-damage = true;

# Rounded corners, matching the shell's cards (the bar and popups draw their own).
corner-radius = 14;

shadow = true;
shadow-radius = 16;
shadow-opacity = 0.32;
shadow-offset-x = -16;
shadow-offset-y = -16;

fading = true;
fade-in-step = 0.08;
fade-out-step = 0.08;
fade-delta = 6;

detect-rounded-corners = true;
detect-client-opacity = true;
detect-transient = true;
# (mark-wmwin-focused / mark-ovredir-focused are replaced by lumen's window
# rules; picom warns on screen if they're used together with rules.)
