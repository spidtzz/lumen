# lumen — kitty
font_family      JetBrains Mono
font_size        11
window_padding_width 12
cursor_shape     beam
cursor_blink_interval 0
enable_audio_bell no
confirm_os_window_close 0
# fish (with lumen's prompt and colours), falling back to your login shell
# if fish isn't installed. Remove this line to always use your login shell.
shell sh -c 'exec "$(command -v fish || echo "${SHELL:-/bin/bash}")" -l'
tab_bar_style    powerline
tab_powerline_style round

# Colours follow the lumen theme (generated by lumen-theme).
include theme.conf
