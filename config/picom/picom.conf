# lumen — picom compositor
# bspwmrc starts picom with this backend and falls back to xrender if it fails.
backend = "glx";
vsync = true;
use-damage = true;

# Rounded corners (the bar and its popups draw their own).
corner-radius = 12;
rounded-corners-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "class_g = 'quickshell'"
];

shadow = true;
shadow-radius = 16;
shadow-opacity = 0.28;
shadow-offset-x = -14;
shadow-offset-y = -10;
shadow-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "class_g = 'quickshell'",
  "_GTK_FRAME_EXTENTS@"
];

fading = true;
fade-in-step = 0.08;
fade-out-step = 0.08;
fade-delta = 6;

detect-rounded-corners = true;
detect-client-opacity = true;
detect-transient = true;
mark-wmwin-focused = true;
mark-ovredir-focused = true;
